function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}

 engGain=AC.createGain();engGain.gain.value=0;eng.connect(engGain);const g2=AC.createGain();g2.gain.value=.35;eng2.connect(g2);g2.connect(engGain);engGain.connect(lp);eng.start();eng2.start();
 const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const ns=AC.createBufferSource();ns.buffer=buf;ns.loop=true;windFilter=AC.createBiquadFilter();windFilter.type='bandpass';windFilter.frequency.value=800;windFilter.Q.value=.6;
 noiseGain=AC.createGain();noiseGain.gain.value=0;ns.connect(windFilter);windFilter.connect(noiseGain);noiseGain.connect(master);ns.start();
}
function beep(f,dur=.15,type='sine',vol=.25,when=0){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(window._master);o.start(t);o.stop(t+dur+.02)}

 if(!AC)return;const t=AC.currentTime,k=spd/280,gear=Math.floor(k*5.2),f=(k*5.2-gear),base=55+f*85+gear*14+(boosting?18:0);

 engGain.gain.setTargetAtTime(muted?0:.1+k*.1+(boosting?.05:0),t,.08);
 noiseGain.gain.setTargetAtTime(muted?0:Math.min(.28,k*k*.3)+(boosting?.06:0)+(braking?.04:0),t,.1);

}

function nearestRoad(){let best=Infinity,bestIndex=roadIndex;for(let d=-25;d<=25;d++){const i=(roadIndex+d+N)%N,p=points[i],dx=p.x-carPos.x,dz=p.z-carPos.z,dist=dx*dx+dz*dz;if(dist<best){best=dist;bestIndex=i}}roadIndex=bestIndex;return Math.sqrt(best)}

function tick(now){

 const dt=Math.min(.04,(now-last)/1000);last=now;
 if(!finished&&!garageOpen){
  const boosting=keys.boost&&!keys.brake;

   for(let i=0;i<rivals.length;i++){const dL=(rivalsTotal[i]-pT)*trackLength,dW=rLat[i]-laneOffset;
    if(Math.abs(dL)<11.5&&Math.abs(dW)<7.6){const sg=dW>=0?1:-1;
     if(dL>0)speed=Math.min(speed,rivalsSpeeds[i]*.97);else rivalsSpeeds[i]=Math.min(rivalsSpeeds[i],speed*.99+8);
     laneOffset-=sg*dt*14;rLat[i]=THREE.MathUtils.clamp(rLat[i]+sg*dt*9,-11,11);
     if(bumpCool<=0){beep(95,.14,'sawtooth',.22);bumpCool=.5}}}
   laneOffset=THREE.MathUtils.clamp(laneOffset,-maxOffset,maxOffset)}
  progress+=speed/3.6*dt/trackLength;
  if(progress>=1){
   progress-=1;lap++;
   if(lap>3){finished=true;{const fp=1+rivalsTotal.filter(v=>v>=3).length;document.querySelector('#finish h1').textContent=fp===1?'🏆 ניצחת במרוץ!':'🏁 סיימת במקום '+fp+' מתוך 4'}document.getElementById('finish').style.display='flex';beep(784,.15,'triangle',.3);beep(988,.15,'triangle',.3,.15);beep(1318,.4,'triangle',.3,.3);document.getElementById('result').textContent='זמן: '+((now-start)/1000).toFixed(1)+' שניות'}
  }
  const p=curve.getPointAt(progress),t=curve.getTangentAt(progress).normalize();
  const n=new THREE.Vector3(-t.z,0,t.x);
  carPos.copy(p).addScaledVector(n,laneOffset);
  const roadYaw=Math.atan2(-t.x,-t.z);
  const angle=roadYaw-steer*.11;
  visualYaw+=Math.atan2(Math.sin(angle-visualYaw),Math.cos(angle-visualYaw))*Math.min(1,dt*10);
  player.group.position.copy(carPos);
  player.group.rotation.y=visualYaw;
  player.group.rotation.z=-steer*.055;
  player.flame.visible=boosting;
  player.flame.scale.setScalar(.85+Math.sin(now*.024)*.2);spinWheels(player,speed/3.6*dt,steer);player.tail.emissiveIntensity=keys.brake?3.2:.9;
  for(let i=0;i<rivals.length;i++){
   {const pT=(lap-1)+progress,gap=(rivalsTotal[i]-pT)*trackLength;
    rNext[i]-=dt;if(rNext[i]<=0){rLeft[i]=1.8+Math.random()*1.7;rNext[i]=5+Math.random()*7}
    let tgt=rBase[i]+(rLeft[i]>0?64:0);rLeft[i]=Math.max(0,rLeft[i]-dt);
    // stay in the fight: chase hard when behind the player (matching turbo speed), ease off when far ahead
    const want=-40-70*Math.sin((now-start)/1000*.2+i*2.1); // each rival drifts between ~30 m ahead and ~110 m behind the player
    if(gap<want)tgt=Math.max(tgt,Math.min(rCap[i],speed+5+Math.min(10,(want-gap)/25)));else if(gap>150)tgt*=.92;else if(gap>70)tgt*=.97;

  document.getElementById('speed').textContent=Math.round(speed);
  document.getElementById('lap').textContent=Math.min(lap,3);{const pT2=(lap-1)+progress;let pl=1;for(const v of rivalsTotal)if(v>pT2)pl++;document.getElementById('place').textContent=pl}

 }
 sky.position.copy(camera.position);for(const c of clouds){c.position.x+=c.userData.s*dt*2;if(c.position.x>520)c.position.x=-520}
