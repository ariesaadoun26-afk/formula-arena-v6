<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>FORMULA ARENA V6 | Coastal Circuit</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071522;color:white;font-family:Arial,system-ui;touch-action:none}canvas{display:block}#hud{position:absolute;inset:0;pointer-events:none}#top{position:absolute;top:max(9px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;align-items:start;justify-content:space-between;gap:6px;direction:ltr}.pill{background:#071526d9;border:1px solid #ffffff44;border-radius:12px;padding:7px 12px;box-shadow:0 6px 22px #0006;backdrop-filter:blur(6px)}.brand{color:#ffd66b;font-size:13px;font-weight:900;letter-spacing:1px}.small{font-size:10px;color:#c3d4e7}.big{font-size:21px;font-weight:900}.controls{position:absolute;bottom:max(13px,env(safe-area-inset-bottom));left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:end;direction:ltr;pointer-events:auto}.cluster{display:flex;gap:10px;align-items:end}.btn{border:1px solid #ffffff77;background:#0b1c33c9;color:#fff;border-radius:19px;width:72px;height:72px;font-size:31px;font-weight:900;touch-action:none;user-select:none;cursor:pointer;box-shadow:0 6px 22px #0008}.btn:active,.btn.active{background:#2c5885}.boost{width:88px;height:88px;border-radius:50%;font-size:17px;background:radial-gradient(circle at 35% 25%,#ffc66e,#e4492b 60%,#8b183e);border:3px solid #ffbf70}.brake{width:65px;height:65px;font-size:13px}.message{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#091728c9;border:1px solid #ffffff44;border-radius:11px;padding:8px 14px;font-size:12px;white-space:nowrap}#rotate{display:none;position:absolute;inset:0;background:#071526f5;z-index:9;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;gap:12px}#rotate strong{font-size:24px}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#071526;z-index:12;font-weight:bold;color:#ffdf8b}#finish{display:none;position:absolute;inset:0;z-index:8;background:#04101dd9;align-items:center;justify-content:center;flex-direction:column;gap:15px}#finish h1{font-size:34px;margin:0;color:#ffd56d}#again{border:0;background:#ffd56d;color:#102031;padding:14px 25px;border-radius:14px;font-size:18px;font-weight:bold;cursor:pointer}#map{position:absolute;top:74px;right:max(12px,env(safe-area-inset-right));width:124px;height:110px;border-radius:12px;background:#071526a9;border:1px solid #ffffff44} @media(orientation:portrait){#rotate{display:flex}}@media(max-height:400px){.btn{width:58px;height:58px}.boost{width:72px;height:72px}.brake{width:54px;height:54px}.message{display:none}#map{width:100px;height:88px}}
</style></head><body>
<div id="loading">🏎️ טוען מסלול חוף תלת־ממדי...</div>
<div id="hud"><div id="top"><div class="pill"><div class="brand">FORMULA ARENA</div><div class="small">V6.4 • REAL DRIVING</div></div><div class="pill" style="text-align:center"><div class="small">הקפה</div><div class="big"><span id="lap">1</span> / 3</div></div><div class="pill" style="text-align:center"><div class="big"><span id="speed">0</span></div><div class="small">KM/H</div></div></div><canvas id="map" width="248" height="220"></canvas><div class="message" id="msg">היגוי חופשי • בלימה בפניות • שלוש הקפות</div><div class="controls"><div class="cluster"><button class="btn" id="left" aria-label="פנייה שמאלה">◀</button><button class="btn" id="right" aria-label="פנייה ימינה">▶</button></div><div class="cluster"><button class="btn brake" id="brake">בלם</button><button class="btn boost" id="boost">⚡<br>טורבו</button></div></div></div>
<div id="rotate"><div style="font-size:55px">📱↻</div><strong>סובב את האייפון לרוחב</strong><div>המרוץ מיועד למסך אופקי</div></div>
<div id="finish"><h1>🏆 סיימת את המרוץ!</h1><div id="result"></div><button id="again">מרוץ נוסף ↻</button></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bcde2);scene.fog=new THREE.FogExp2(0x9acde1,.0038);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1100);
scene.add(new THREE.HemisphereLight(0xe0f4ff,0x647154,2.3));const sun=new THREE.DirectionalLight(0xffe9bc,2.8);sun.position.set(-80,110,-50);scene.add(sun);
const mat=(c,r=.75,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,side:THREE.DoubleSide});
const asphalt=mat(0x343941,.91),sand=mat(0xd6c28d),grass=mat(0x37734e),sea=mat(0x1599b9,.26,.16),white=mat(0xf4f4ec),red=mat(0xe74c47),yellow=mat(0xffc84a),black=mat(0x131820),glass=mat(0x172c3b,.22,.45),rubber=mat(0x0d1219),metal=mat(0x9da8b2,.3,.7),blue=mat(0x2479e6,.3,.25);
function box(w,h,d,m,x,y,z,p=scene){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=h>.5;o.receiveShadow=true;p.add(o);return o}
function cyl(rt,rb,h,m,x,y,z,p=scene){let o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,9),m);o.position.set(x,y,z);p.add(o);return o}
box(1400,.1,1400,sea,0,-.45,0);box(760,.18,720,sand,0,-.18,0);box(650,.12,610,grass,0,-.04,0);
// A smooth closed circuit: straights, S-bends, and a broad hairpin.
const nodes=[[-210,-90],[-120,-145],[10,-153],[145,-125],[216,-65],[222,25],[174,102],[75,135],[5,85],[-65,52],[-115,105],[-187,110],[-239,45],[-241,-28]];
const curve=new THREE.CatmullRomCurve3(nodes.map(([x,z])=>new THREE.Vector3(x,0,z)),true,'centripetal',.42);
const N=700,roadWidth=29,points=[],tangents=[],normals=[];
for(let i=0;i<N;i++){let u=i/N,p=curve.getPointAt(u),t=curve.getTangentAt(u).normalize();points.push(p);tangents.push(t);normals.push(new THREE.Vector3(-t.z,0,t.x))}
function ribbon(inner,outer,m,y){let v=[],idx=[];for(let i=0;i<N;i++){const p=points[i],n=normals[i];v.push(p.x+n.x*inner,y,p.z+n.z*inner,p.x+n.x*outer,y,p.z+n.z*outer)}for(let i=0;i<N;i++){let j=(i+1)%N,a=i*2,b=j*2;idx.push(a,b,a+1,a+1,b,b+1)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();let mesh=new THREE.Mesh(g,m);mesh.receiveShadow=true;scene.add(mesh);return mesh}
ribbon(-roadWidth/2-3,roadWidth/2+3,mat(0x575c63),.07);ribbon(-roadWidth/2,roadWidth/2,asphalt,.12);
for(let s of [-1,1]){ribbon(s*(roadWidth/2-.9),s*(roadWidth/2),white,.16);ribbon(s*(roadWidth/2),s*(roadWidth/2+1.7),red,.14)}
const stripeMat=new THREE.MeshBasicMaterial({color:0xf2e9ca});
for(let k=1;k<4;k++){let offset=-roadWidth/2+k*roadWidth/4;for(let i=0;i<N;i+=13){let p=points[i],n=normals[i],t=tangents[i];let stripe=box(.35,.025,5,stripeMat,p.x+n.x*offset,.18,p.z+n.z*offset);stripe.rotation.y=Math.atan2(-t.x,-t.z)}}
const checkA=points[0],checkT=tangents[0],checkN=normals[0];for(let k=0;k<12;k++){let x=-roadWidth/2+(k+.5)*roadWidth/12;for(let z of [-1,1]){let o=box(roadWidth/12,.03,1.25,(k+((z+1)/2))%2===0?white:black,checkA.x+checkN.x*x+checkT.x*z*.65,.2,checkA.z+checkN.z*x+checkT.z*z*.65);o.rotation.y=Math.atan2(-checkT.x,-checkT.z)}}

// Track wear and edge detailing: low-cost decals and occasional marker posts.
const rubberMark=mat(0x242930,.98);
for(let i=5;i<N;i+=7){
 const p=points[i],t=tangents[i],n=normals[i];
 for(let lane of [-5,5]){
  const x=p.x+n.x*lane,z=p.z+n.z*lane;
  let mark=box(.17,.016,4.5,rubberMark,x,.188,z);
  mark.rotation.y=Math.atan2(-t.x,-t.z);
 }
}
const curbLight=mat(0xfff4df),curbDark=mat(0xdc3835);
for(let i=0;i<N;i+=7){
 const p=points[i],t=tangents[i],n=normals[i];
 for(let side of [-1,1]){
  let o=box(1.8,.11,4.6,(Math.floor(i/7)%2)?curbLight:curbDark,
  p.x+n.x*side*(roadWidth/2+1),.24,p.z+n.z*side*(roadWidth/2+1));
  o.rotation.y=Math.atan2(-t.x,-t.z)
 }
}
const trunk=mat(0x805b3c),leaf=mat(0x26774d),wall=mat(0xe5e4df);
for(let i=0;i<N;i+=10){let p=points[i],n=normals[i];for(let side of [-1,1]){let d=roadWidth/2+6;let x=p.x+n.x*d*side,z=p.z+n.z*d*side;let a=box(3,1.1,3,wall,x,.75,z);a.rotation.y=Math.atan2(-tangents[i].x,-tangents[i].z)}}

// Sparse palm silhouettes placed outside the track.
const palmLeaf=mat(0x2e8655),palmTrunk=mat(0x97724e);
function palm(x,z,h){
 cyl(.45,.78,h,palmTrunk,x,h/2,z);
 for(let j=0;j<6;j++){
  const a=j*Math.PI/3;
  const branch=box(.65,.19,7.2,palmLeaf,x+Math.sin(a)*2.9,h+.9,z+Math.cos(a)*2.9);
  branch.rotation.y=a;branch.rotation.x=.13;
 }
}
for(let i=0;i<75;i++){
 let a=i*2.39996,r=198+(i%7)*17,x=Math.cos(a)*r,z=Math.sin(a)*r;
 let minDist=Infinity;
 for(let j=0;j<N;j+=14)minDist=Math.min(minDist,Math.hypot(points[j].x-x,points[j].z-z));
 if(minDist<35||Math.abs(x)>345||Math.abs(z)>310)continue;
 palm(x,z,8+(i%4)*1.4)
}
// A small coastal town, grandstand and simple marina silhouettes.
const stucco=[mat(0xf4e9d5),mat(0xcadbe0),mat(0xf1d4b2)];
for(let i=0;i<12;i++){
 let x=-330+i*16,h=10+(i%4)*4;
 box(13,h,14,stucco[i%3],x,h/2,-225);
 box(14,.6,15,mat(0x995c46),x,h+.2,-225);
 for(let j=0;j<3;j++)box(2.3,2.8,.12,glass,x-3+j*3,h*.55,-217.9)
}
const dock=mat(0xa6b1b9),sail=mat(0xf3f4f0);
for(let i=0;i<5;i++){
 let x=250+i*20,z=-205+(i%2)*18;
 box(9,1.4,22,sail,x,.8,z);
 box(1,7,1,dock,x,4,z);
 let canopy=new THREE.Mesh(new THREE.ConeGeometry(4.3,7,4),sail);
 canopy.position.set(x,7.4,z);scene.add(canopy)
}
function buildCar(color,kind='formula'){
 const group=new THREE.Group(),body=mat(color,.29,.48);
 const accent=mat(0xf0f4f8,.34,.2),carbon=mat(0x171d26,.6,.15);
 const wheelRadius=kind==='formula'?.82:.72;
 const wheelZ=kind==='formula'?2.25:2.1;
 function wheel(x,z){
  const tire=new THREE.Mesh(new THREE.CylinderGeometry(wheelRadius,wheelRadius,.68,14),rubber);
  tire.rotation.z=Math.PI/2;tire.position.set(x,.83,z);tire.castShadow=true;group.add(tire);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.70,12),metal);
  rim.rotation.z=Math.PI/2;rim.position.set(x,.83,z);group.add(rim);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.73,10),black);
  hub.rotation.z=Math.PI/2;hub.position.set(x,.83,z);group.add(hub)
 }
 if(kind==='formula'){
  box(1.65,.65,6.6,body,0,1.03,0,group);
  box(2.5,.35,2.65,body,0,.97,1.2,group);
  box(1.95,.5,1.45,body,0,1.38,-.35,group);
  box(1.2,.18,1.5,carbon,0,1.71,-.42,group);
  box(.85,.55,1.25,glass,0,1.62,.2,group);
  box(4.8,.17,.76,carbon,0,1.48,3.25,group);
  box(4.7,.16,.8,carbon,0,1.27,-3.28,group);
  for(let x of [-1.45,1.45]){
   box(.7,.19,2.8,body,x,.88,0,group);
   box(.17,.38,.75,carbon,x,1.2,-2.65,group)
  }
  box(.18,.56,.8,carbon,0,1.85,2.6,group);
  for(let x of [-1.95,1.95])for(let z of [-wheelZ,wheelZ])wheel(x,z);
  box(.9,.12,1.4,accent,0,1.43,-1.6,group)
 }else{
  box(3.7,.74,7.0,body,0,1.03,0,group);
  box(3.28,.47,4.5,body,0,1.48,-.3,group);
  box(2.85,.10,2.6,glass,0,1.76,-.7,group);
  box(2.8,.13,1.45,glass,0,1.62,1.05,group);
  box(3.65,.24,1.15,body,0,1.26,-2.6,group);
  box(4.15,.15,.65,carbon,0,1.93,2.98,group);
  for(let x of [-1.8,1.8])for(let z of [-wheelZ,wheelZ])wheel(x,z);
  for(let x of [-1.13,1.13]){
   box(.8,.16,.23,accent,x,1.15,-3.53,group);
   box(.75,.14,.19,red,x,1.13,3.48,group)
  }
  box(2.8,.16,.32,carbon,0,.81,3.49,group)
 }
 const flame=new THREE.Mesh(new THREE.ConeGeometry(.46,2.9,8),new THREE.MeshBasicMaterial({color:0x2bc9ff,transparent:true,opacity:.85}));
 flame.rotation.x=Math.PI/2;flame.position.set(0,.9,5.2);flame.visible=false;group.add(flame);
 scene.add(group);return {group,flame,kind}
}
const player=buildCar(0xe83439,'formula'),rivals=[buildCar(0x2b84ed,'sport'),buildCar(0xffc12e,'sport'),buildCar(0x21c9a6,'formula')];
let progress=0,steer=0,speed=0,lap=1,finished=false,start=performance.now();
const keys={left:false,right:false,boost:false,brake:false};
const startPos=curve.getPointAt(0),startTan=curve.getTangentAt(0).normalize();
let carPos=startPos.clone(),yaw=Math.atan2(-startTan.x,-startTan.z),roadIndex=0,passed=0,checkpoint=0,drift=0;
const checkpointCount=8;
function resetDrive(){laneOffset=0;visualYaw=0;rivalsProgress[0]=.025;rivalsProgress[1]=.046;rivalsProgress[2]=.069;carPos.copy(startPos);yaw=Math.atan2(-startTan.x,-startTan.z);roadIndex=0;passed=0;checkpoint=0;drift=0;progress=0;speed=0;lap=1;finished=false;start=performance.now();document.getElementById('finish').style.display='none'}
for(let key of Object.keys(keys)){let el=document.getElementById(key);const set=v=>{keys[key]=v;el.classList.toggle('active',v)};el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);set(true)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>set(false))}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '||e.key==='Shift')keys.boost=true;if(e.key==='ArrowDown')keys.brake=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key===' '||e.key==='Shift')keys.boost=false;if(e.key==='ArrowDown')keys.brake=false});
const trackLength=curve.getLength();const map=document.getElementById('map'),ctx=map.getContext('2d');
function mapDraw(){const w=map.width,h=map.height;ctx.clearRect(0,0,w,h);ctx.lineWidth=10;ctx.strokeStyle='#dce3e9';ctx.beginPath();points.forEach((p,i)=>{let x=(p.x+280)/560*(w-20)+10,y=(p.z+195)/390*(h-18)+9;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.stroke();let p=carPos;ctx.fillStyle='#ff5959';ctx.beginPath();ctx.arc((p.x+280)/560*(w-20)+10,(p.z+195)/390*(h-18)+9,7,0,Math.PI*2);ctx.fill()}
let last=performance.now();const camTarget=new THREE.Vector3();
function nearestRoad(){let best=Infinity,bestIndex=roadIndex;for(let d=-25;d<=25;d++){const i=(roadIndex+d+N)%N,p=points[i],dx=p.x-carPos.x,dz=p.z-carPos.z,dist=dx*dx+dz*dz;if(dist<best){best=dist;bestIndex=i}}roadIndex=bestIndex;return Math.sqrt(best)}
// Arcade assisted steering: the track guides heading while player controls lateral placement.
let laneOffset=0,visualYaw=0;
const rivalsProgress=[.025,.046,.069];
const rivalsSpeeds=[137,157,171]; // km/h: independently paced AI, not locked to player
function tick(now){
 requestAnimationFrame(tick);
 const dt=Math.min(.04,(now-last)/1000);last=now;
 if(!finished){
  const boosting=keys.boost&&!keys.brake;
  const target=keys.brake?80:boosting?280:208;
  speed+=(target-speed)*Math.min(1,dt*(keys.brake?3.5:1.5));
  steer=Number(keys.right)-Number(keys.left);
  // Gentle lateral movement; car cannot accidentally leave the circuit.
  const maxOffset=roadWidth/2-3.6;
  laneOffset=THREE.MathUtils.clamp(laneOffset+steer*dt*(9+speed*.017),-maxOffset,maxOffset);
  // Slight slowdown when hugging barriers, with no punishing reset.
  if(Math.abs(laneOffset)>maxOffset-1.3) speed=Math.min(speed,175);
  progress+=speed/3.6*dt/trackLength;
  if(progress>=1){
   progress-=1;lap++;
   if(lap>3){finished=true;document.getElementById('finish').style.display='flex';document.getElementById('result').textContent='זמן: '+((now-start)/1000).toFixed(1)+' שניות'}
  }
  const p=curve.getPointAt(progress),t=curve.getTangentAt(progress).normalize();
  const n=new THREE.Vector3(-t.z,0,t.x);
  carPos.copy(p).addScaledVector(n,laneOffset);
  const roadYaw=Math.atan2(-t.x,-t.z);
  const angle=roadYaw-steer*.11;
  visualYaw+=Math.atan2(Math.sin(angle-visualYaw),Math.cos(angle-visualYaw))*Math.min(1,dt*10);
  player.group.position.copy(carPos);
  player.group.rotation.y=visualYaw;
  player.group.rotation.z=-steer*.055;
  player.flame.visible=boosting;
  player.flame.scale.setScalar(.85+Math.sin(now*.024)*.2);
  for(let i=0;i<rivals.length;i++){
   rivalsProgress[i]=(rivalsProgress[i]+rivalsSpeeds[i]/3.6*dt/trackLength)%1;
   const rp=rivalsProgress[i],pt=curve.getPointAt(rp),tt=curve.getTangentAt(rp).normalize();
   const nn=new THREE.Vector3(-tt.z,0,tt.x);
   rivals[i].group.position.copy(pt).addScaledVector(nn,[-8,0,8][i]);
   rivals[i].group.rotation.y=Math.atan2(-tt.x,-tt.z);
  }
  const desired=carPos.clone().addScaledVector(t,-30).add(new THREE.Vector3(0,32,0));
  camera.position.lerp(desired,Math.min(1,dt*4));
  camTarget.copy(carPos).addScaledVector(t,26);camTarget.y=1.4;camera.lookAt(camTarget);
  document.getElementById('speed').textContent=Math.round(speed);
  document.getElementById('lap').textContent=Math.min(lap,3);
  document.getElementById('msg').textContent=boosting?'⚡ טורבו פעיל — עקוף את היריבים!':keys.brake?'🏁 בלימה':'🏎️ היגוי קל • עקיפות אמיתיות • מסלול חוף';
  mapDraw();
 }
 renderer.render(scene,camera);
}
document.getElementById('again').onclick=resetDrive;
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);document.getElementById('loading').remove();requestAnimationFrame(tick);
</script></body></html>
